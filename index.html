<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ATS Foto App</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#111827}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#64748b;margin-bottom:14px}
.card{background:white;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000012}
.job{border:4px solid #1769e0;border-radius:22px;padding:18px;margin-bottom:14px}
.label{font-weight:800;font-size:18px;color:#475569}.article{font-size:32px;font-weight:900;word-break:break-word;margin:5px 0 14px}.loc{font-size:26px;font-weight:800;word-break:break-word}
button,.filebtn{width:100%;border:0;border-radius:18px;padding:18px 14px;margin:7px 0;font-size:20px;font-weight:900;cursor:pointer}
.primary{background:#1769e0;color:#fff}.yellow{background:#f5c400;color:#111}.green{background:#16a34a;color:#fff}.gray{background:#e2e8f0;color:#111827}.red{background:#dc2626;color:white}
input[type=file]{display:none}
.status{text-align:center;font-weight:700;color:#475569;padding:6px}.count{text-align:center;font-size:18px;font-weight:800}
.preview{width:100%;border-radius:18px;display:block;margin:10px 0;max-height:65vh;object-fit:contain;background:#111}
.small{font-size:14px;color:#64748b;text-align:center}
.hidden{display:none!important}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>📋 ATS FOTO APP</h1>
<div class="sub">Online lijst — kolom A = artikel, kolom B = locatie</div>

<div class="card">
<label class="filebtn primary" for="excelFile">📂 LIJST UPLOADEN / BIJWERKEN</label>
<input id="excelFile" type="file" accept=".xlsx,.xls,.csv">
<div id="listStatus" class="status">Upload je Excel-lijst om te starten.</div>
</div>

<div id="work" class="hidden">
<div class="job">
<div class="label">📋 TE DOEN ARTIKEL</div>
<div id="article" class="article">—</div>
<div class="label">📍 LOCATIE</div>
<div id="location" class="loc">—</div>
</div>

<div class="card">
<div id="cameraArea">
<button class="primary" id="cameraBtn">📷 CAMERA OPENEN</button>
<button class="yellow" id="skipBtn">⏭️ OVERSLAAN — LATER OPNIEUW</button>
</div>

<div id="previewArea" class="hidden">
<div id="photoLabel" class="status"></div>
<img id="preview" class="preview">
<button class="green" id="saveBtn">💾 FOTO OPSLAAN</button>
<button class="primary" id="moreBtn">📸 NOG 1 FOTO</button>
<button class="gray" id="againBtn">🔄 OPNIEUW FOTO</button>
<button class="primary" id="nextBtn">➡️ VOLGEND ARTIKEL</button>
<button class="red" id="stopBtn">🛑 STOPPEN VOOR VANDAAG</button>
</div>
</div>

<div class="card">
<div id="count" class="count"></div>
<button class="primary" id="zipBtn">📦 ZIP MAKEN</button>
<div class="small">De ZIP wordt op je gsm opgeslagen als FOTO_DD-MM-JJJJ.zip. Daarna kun je hem handmatig via Outlook versturen.</div>
</div>
</div>
</div>

<video id="video" class="hidden" autoplay playsinline></video>
<canvas id="canvas" class="hidden"></canvas>

<script>
const $=id=>document.getElementById(id);

// Supabase configuration
const SUPABASE_URL = 'https://jtxiyimxmleckllirfiu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_G9IguMo459i5YbrYWihRJw_bXjrCGfp';
const TABLE_NAME = "werklex's Org";
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let items=[], current=null, stream=null, pendingBlob=null, photoNo=0, sessionPhotos=[];

function baseArticle(a){
  return String(a||'').trim().replace(/_(N|R|U|K)$/i,'');
}
function cleanCell(v){
  return String(v ?? '').trim().replace(/\\_/g,'_');
}
function isArticleCode(a){
  return /^[A-Z0-9]+_(?:N|R|U|K)$/i.test(a);
}
function safeName(s){
  return String(s).replace(/[^\w.-]+/g,'_');
}

function normalizeRows(rows){
  // Group _N/_R/_U/_K into one work item.
  // The first row found supplies the displayed article + location.
  const map = new Map();
  for(const r of rows || []){
    const a = cleanCell(r.artikel);
    const l = cleanCell(r.locatie);
    if(!isArticleCode(a) || !l) continue;
    const key = baseArticle(a);
    if(!map.has(key)){
      map.set(key,{
        key,
        article:a,
        location:l,
        rows:[r]
      });
    }else{
      map.get(key).rows.push(r);
    }
  }
  return [...map.values()];
}

async function fetchItems(){
  $('listStatus').textContent='Lijst ophalen van de online database…';
  const {data,error}=await db
    .from(TABLE_NAME)
    .select('id, artikel, locatie, status')
    .order('id',{ascending:true});

  if(error){
    console.error(error);
    $('listStatus').textContent='Fout bij ophalen van de lijst: '+error.message;
    $('work').classList.add('hidden');
    return false;
  }

  items = normalizeRows(data);
  render();
  $('listStatus').textContent=`${data.length} regels online → ${items.length} unieke artikelen.`;
  return true;
}

function openItems(){
  return items.filter(x=>{
    // An article is complete if any matching database row is "klaar".
    // Otherwise it remains open, including skipped items.
    return !x.rows.some(r=>String(r.status||'').toLowerCase()==='klaar');
  });
}

async function setStatusForCurrent(status){
  if(!current)return;
  const ids = current.rows.map(r=>r.id);
  const {error} = await db
    .from(TABLE_NAME)
    .update({status})
    .in('id', ids);

  if(error){
    alert('Kon de status niet opslaan: '+error.message);
    console.error(error);
    return false;
  }

  current.rows.forEach(r=>r.status=status);
  return true;
}

async function nextItem(){
  const available = openItems();
  if(!available.length){
    current=null;
    render();
    return;
  }

  // Prefer items that weren't skipped, then skipped items.
  current = available.find(x=>String(x.rows?.[0]?.status||'').toLowerCase()!=='overgeslagen')
         || available[0];

  photoNo=0;
  pendingBlob=null;
  $('article').textContent=current.article;
  $('location').textContent=current.location;
  $('cameraArea').classList.remove('hidden');
  $('previewArea').classList.add('hidden');
}

function render(){
  const left=openItems().length;
  $('work').classList.toggle('hidden', items.length===0);
  $('count').textContent=items.length ? `${left} artikel${left===1?'':'en'} nog te doen` : '';
  if(items.length && !current) nextItem();
}

$('excelFile').onchange = async e => {
  // The upload button now serves as a list import/synchronization helper.
  // It updates the online table instead of keeping the list only on this device.
  const f=e.target.files[0];
  if(!f)return;
  try{
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const data=[];
        for(let i=0;i<rows.length;i++){
          const a=cleanCell(rows[i][0]), l=cleanCell(rows[i][1]);
          if(!isArticleCode(a) || !l) continue;
          data.push({artikel:a,locatie:l,status:null});
        }
        if(!data.length){
          $('listStatus').textContent='Geen geldige artikellijnen gevonden. Kolom A moet artikel zijn en kolom B locatie.';
          return;
        }
        $('listStatus').textContent=`${data.length} geldige Excel-regels gevonden. Online lijst bijwerken…`;

        // For a fresh list import, replace existing list rows.
        // This action requires the table to permit DELETE/INSERT, so only perform
        // this when the user explicitly uploads a list.
        const del = await db.from(TABLE_NAME).delete().not('id','is',null);
        if(del.error){
          $('listStatus').textContent='Lijst kon niet vervangen worden: '+del.error.message;
          return;
        }

        const chunk=500;
        for(let i=0;i<data.length;i+=chunk){
          const ins=await db.from(TABLE_NAME).insert(data.slice(i,i+chunk));
          if(ins.error){
            $('listStatus').textContent='Lijst kon niet volledig worden geïmporteerd: '+ins.error.message;
            return;
          }
        }
        current=null;
        await fetchItems();
      }catch(err){
        console.error(err);
        $('listStatus').textContent='Excel kon niet worden gelezen.';
      }
    };
    reader.readAsArrayBuffer(f);
  }catch(err){
    console.error(err);
  }
};

// Camera: open, take one frame, immediately stop camera, show preview.
$('cameraBtn').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    $('video').srcObject=stream;
    $('video').classList.remove('hidden');
    await new Promise(r=>setTimeout(r,250));
    const v=$('video'), c=$('canvas');
    c.width=v.videoWidth||1280;
    c.height=v.videoHeight||720;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    v.srcObject?.getTracks().forEach(t=>t.stop());
    stream=null;
    v.srcObject=null;
    v.classList.add('hidden');

    pendingBlob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.92));
    const url=URL.createObjectURL(pendingBlob);
    $('preview').src=url;
    photoNo++;
    $('photoLabel').textContent=`${current.article} — FOTO ${photoNo}`;
    $('cameraArea').classList.add('hidden');
    $('previewArea').classList.remove('hidden');
  }catch(e){
    alert('Camera kan niet worden geopend. Controleer Chrome en de cameratoestemming voor deze website.');
  }
};

$('againBtn').onclick=()=>{
  pendingBlob=null;
  $('previewArea').classList.add('hidden');
  $('cameraArea').classList.remove('hidden');
};

async function savePhoto(alsoFinish){
  if(!pendingBlob || !current)return;
  const sameCount=sessionPhotos.filter(p=>p.key===current.key).length+1;
  sessionPhotos.push({
    name:`${safeName(baseArticle(current.article))}_${String(sameCount).padStart(2,'0')}.jpg`,
    blob:pendingBlob,
    key:current.key
  });
  pendingBlob=null;

  if(alsoFinish){
    const ok=await setStatusForCurrent('klaar');
    if(!ok)return;
    current=null;
    await nextItem();
    render();
  }else{
    $('previewArea').classList.add('hidden');
    $('cameraArea').classList.remove('hidden');
  }
}

$('saveBtn').onclick=()=>savePhoto(true);
$('moreBtn').onclick=async()=>{
  // Keep the first preview as a saved session photo, but don't finish the article.
  await savePhoto(false);
  $('cameraArea').classList.remove('hidden');
  $('previewArea').classList.add('hidden');
  $('cameraBtn').click();
};

$('nextBtn').onclick=async()=>{
  // "Volgend artikel" without saving means temporary skip, not finished.
  const ok=await setStatusForCurrent('overgeslagen');
  if(!ok)return;
  current=null;
  await nextItem();
  render();
};

$('skipBtn').onclick=()=>$('nextBtn').click();

$('stopBtn').onclick=()=>{
  pendingBlob=null;
  alert('Voortgang is online opgeslagen. Je kunt later op eender welke gsm verdergaan.');
};

$('zipBtn').onclick=async()=>{
  if(!sessionPhotos.length){
    alert('Er zijn in deze sessie nog geen foto’s gemaakt.');
    return;
  }
  const zip=new JSZip();
  for(const p of sessionPhotos) zip.file(p.name,p.blob);
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const filename=`FOTO_${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}.zip`;
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
};

fetchItems();

</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</body>
</html>
