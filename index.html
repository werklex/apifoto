<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ATS Foto App</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#111827}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#64748b;margin-bottom:14px}
.card{background:white;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000012}
.job{border:4px solid #1769e0;border-radius:22px;padding:18px;margin-bottom:14px}
.label{font-weight:800;font-size:18px;color:#475569}.article{font-size:32px;font-weight:900;word-break:break-word;margin:5px 0 14px}.loc{font-size:26px;font-weight:800;word-break:break-word}
button,.filebtn{width:100%;border:0;border-radius:18px;padding:18px 14px;margin:7px 0;font-size:20px;font-weight:900;cursor:pointer}
.primary{background:#1769e0;color:#fff}.yellow{background:#f5c400;color:#111}.green{background:#16a34a;color:#fff}.gray{background:#e2e8f0;color:#111827}.red{background:#dc2626;color:white}
input[type=file]{display:none}
.status{text-align:center;font-weight:700;color:#475569;padding:6px}.count{text-align:center;font-size:18px;font-weight:800}
.preview{width:100%;border-radius:18px;display:block;margin:10px 0;max-height:65vh;object-fit:contain;background:#111}
.small{font-size:14px;color:#64748b;text-align:center}
.hidden{display:none!important}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>📋 ATS FOTO APP</h1>
<div class="sub">Artikelen en locaties uit Excel — kolom A = artikel, kolom B = locatie</div>

<div class="card">
<label class="filebtn primary" for="excelFile">📂 LIJST UPLOADEN</label>
<input id="excelFile" type="file" accept=".xlsx,.xls,.csv">
<div id="listStatus" class="status">Upload je Excel-lijst om te starten.</div>
</div>

<div id="work" class="hidden">
<div class="job">
<div class="label">📋 TE DOEN ARTIKEL</div>
<div id="article" class="article">—</div>
<div class="label">📍 LOCATIE</div>
<div id="location" class="loc">—</div>
</div>

<div class="card">
<div id="cameraArea">
<button class="primary" id="cameraBtn">📷 CAMERA OPENEN</button>
<button class="yellow" id="skipBtn">⏭️ OVERSLAAN — LATER OPNIEUW</button>
</div>

<div id="previewArea" class="hidden">
<div id="photoLabel" class="status"></div>
<img id="preview" class="preview">
<button class="green" id="saveBtn">💾 FOTO OPSLAAN</button>
<button class="primary" id="moreBtn">📸 NOG 1 FOTO</button>
<button class="gray" id="againBtn">🔄 OPNIEUW FOTO</button>
<button class="primary" id="nextBtn">➡️ VOLGEND ARTIKEL</button>
<button class="red" id="stopBtn">🛑 STOPPEN VOOR VANDAAG</button>
</div>
</div>

<div class="card">
<div id="count" class="count"></div>
<button class="primary" id="zipBtn">📦 ZIP MAKEN</button>
<div class="small">De ZIP wordt op je gsm opgeslagen als FOTO_DD-MM-JJJJ.zip. Daarna kun je hem handmatig via Outlook versturen.</div>
</div>
</div>
</div>

<video id="video" class="hidden" autoplay playsinline></video>
<canvas id="canvas" class="hidden"></canvas>

<script>
const $=id=>document.getElementById(id);
let items=[], skipped=new Set(), done=new Set(), photos=[], current=null, stream=null, pendingBlob=null, photoNo=0;
const STORE='atsFotoStateV3';

function baseArticle(a){ return String(a||'').trim().replace(/_(N|R|U|K)$/i,''); }
function displayArticle(a){ return String(a||'').trim(); }
function loadState(){
 try{
  const s=JSON.parse(localStorage.getItem(STORE)||'{}');
  done=new Set(s.done||[]); skipped=new Set(s.skipped||[]);
  items=s.items||[];
  photos=[]; render();
 }catch(e){}
}
function saveState(){
 localStorage.setItem(STORE,JSON.stringify({items,done:[...done],skipped:[...skipped]}));
}
function uniqueItems(rows){
 const map=new Map();
 for(const r of rows){
  const a=String(r[0]??'').trim(), l=String(r[1]??'').trim();
  if(!a || !l) continue;
  if(/^(artikel|article|sparepart)$/i.test(a) && /^(locatie|location|loc)$/i.test(l)) continue;
  const key=baseArticle(a);
  if(!map.has(key)) map.set(key,{key,article:a,location:l});
 }
 return [...map.values()];
}
function parseWorkbook(data){
 const wb=XLSX.read(data,{type:'array'});
 const ws=wb.Sheets[wb.SheetNames[0]];
 const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
 const oldDone=new Set(done), oldSkipped=new Set(skipped);
 const newItems=uniqueItems(rows);
 items=newItems;
 const valid=new Set(items.map(x=>x.key));
 done=new Set([...oldDone].filter(k=>valid.has(k)));
 skipped=new Set([...oldSkipped].filter(k=>valid.has(k)));
 photos=[];
 current=null;
 saveState(); render();
}
$('excelFile').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const reader=new FileReader();
 reader.onload=ev=>{try{parseWorkbook(ev.target.result);$('listStatus').textContent=`${items.length} unieke artikelen geladen.`}catch(err){$('listStatus').textContent='Excel kon niet worden gelezen.'}};
 reader.readAsArrayBuffer(f);
};
function nextItem(){
 const available=items.filter(x=>!done.has(x.key));
 if(!available.length){current=null;render();return}
 const normal=available.find(x=>!skipped.has(x.key));
 current=normal||available[0];
 photoNo=0; pendingBlob=null;
 $('article').textContent=displayArticle(current.article);
 $('location').textContent=current.location;
 $('cameraArea').classList.remove('hidden'); $('previewArea').classList.add('hidden');
}
function render(){
 $('work').classList.toggle('hidden',items.length===0);
 const left=items.filter(x=>!done.has(x.key)).length;
 $('count').textContent=items.length?`${left} artikel${left===1?'':'en'} nog te doen`:'';
 if(items.length && !current) nextItem();
 if(!items.length){$('listStatus').textContent='Upload je Excel-lijst om te starten.'}
}
async function openCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  $('video').srcObject=stream;$('video').classList.remove('hidden');
  await new Promise(r=>setTimeout(r,250));
  $('canvas').width=$('video').videoWidth;$('canvas').height=$('video').videoHeight;
  $('canvas').getContext('2d').drawImage($('video'),0,0);
  stream.getTracks().forEach(t=>t.stop()); stream=null; $('video').srcObject=null; $('video').classList.add('hidden');
  pendingBlob=await new Promise(r=>$('canvas').toBlob(r,'image/jpeg',.92));
  showPreview();
 }catch(e){
  alert('Camera kan niet worden geopend. Controleer in Chrome of camera-toegang voor deze site is toegestaan.');
 }
}
function showPreview(){
 const url=URL.createObjectURL(pendingBlob);
 $('preview').src=url; photoNo++; $('photoLabel').textContent=`${current.article} — FOTO ${photoNo}`;
 $('cameraArea').classList.add('hidden');$('previewArea').classList.remove('hidden');
}
function resetPhoto(){pendingBlob=null;$('previewArea').classList.add('hidden');$('cameraArea').classList.remove('hidden')}
function safeName(s){return String(s).replace(/[^\w.-]+/g,'_')}
$('cameraBtn').onclick=openCamera;
$('againBtn').onclick=()=>{pendingBlob=null;$('previewArea').classList.add('hidden');$('cameraArea').classList.remove('hidden')};
$('moreBtn').onclick=async()=>{if(pendingBlob)savePhoto(false); await openCamera()};
$('saveBtn').onclick=()=>savePhoto(true);
function savePhoto(finish){
 if(!pendingBlob||!current)return;
 photos.push({name:`${safeName(baseArticle(current.article))}_${String(photos.filter(p=>p.key===current.key).length+1).padStart(2,'0')}.jpg`,blob:pendingBlob,key:current.key,article:current.article});
 pendingBlob=null;
 if(finish){done.add(current.key);skipped.delete(current.key);saveState();current=null;nextItem();render()}
 else {$('previewArea').classList.add('hidden');$('cameraArea').classList.remove('hidden')}
}
$('nextBtn').onclick=()=>{pendingBlob=null;skipped.add(current.key);saveState();current=null;nextItem();render()};
$('skipBtn').onclick=()=>{$('nextBtn').click()};
$('stopBtn').onclick=()=>{pendingBlob=null;alert('Voortgang is bewaard. Je kunt later verdergaan.');};
async function makeZip(){
 if(!photos.length){alert('Er zijn nog geen foto’s gemaakt in deze sessie.');return}
 const JSZip=window.JSZip;
 if(!JSZip){alert('ZIP-module wordt nog geladen. Probeer opnieuw.');return}
 const zip=new JSZip();
 for(const p of photos)zip.file(p.name,p.blob);
 const d=new Date(), pad=n=>String(n).padStart(2,'0');
 const filename=`FOTO_${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}.zip`;
 const blob=await zip.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}
$('zipBtn').onclick=makeZip;
loadState();
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</body>
</html>
